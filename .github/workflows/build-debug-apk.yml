# One-off builder for a sideloadable arm64 debug APK (no signing secrets
# needed on a fork). Mirrors the nightly workflow's build steps.
name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      minor:
        description: 'VERSION_MINOR — phải tăng mỗi lần phát hành (kohi-v1.<minor>)'
        required: false
        default: '50'
      patch:
        description: 'VERSION_PATCH'
        required: false
        default: '0'
      abi:
        description: 'arm64-v8a (dien thoai that) hoac x86_64 (emulator test)'
        required: false
        default: 'arm64-v8a'

# Bấm dispatch lần nữa thì huỷ lần trước: hôm 20/8 có 15 lần dispatch, nhiều
# lần chỉ để sửa một chi tiết giao diện, và các run cũ vẫn chạy tới hết.
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      # magic-nix-cache đã bị bỏ: bước "Post" của nó từng tốn 3 phút 07 để đẩy
      # store lên GHA cache — nhiều hơn cả phần nó tiết kiệm được, vì store path
      # của devshell vốn tới từ cache.nixos.org.

      # Cache phần nix tự tải flake input. Log cho thấy riêng "unpacking
      # github:NixOS/nixpkgs" mất 53s mỗi lần chạy.
      - name: Cache nix flake inputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/nix
          key: nix-flake-${{ hashFiles('flake.lock') }}

      # Cache zig: đây là bước nặng nhất (~3 phút, phần lớn là compile lại
      # ghostty + libssh2 + openssl từ đầu). restore-keys quan trọng — sửa một
      # file .zig vẫn dùng lại được package đã tải và phần lớn object của các
      # thư viện C không đổi.
      - name: Cache zig build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-src/.zig-cache
          key: zig-${{ hashFiles('zig-src/build.zig.zon', 'zig-src/**/*.zig') }}
          restore-keys: zig-

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: build chuchu_jni
        env:
          BUILD_ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          # Map ABI -> triple zig (x86_64 dung cho emulator test tren may PC)
          case "$BUILD_ABI" in
            arm64-v8a) ZIG_TARGET=aarch64-linux-android.24 ;;
            x86_64)    ZIG_TARGET=x86_64-linux-android.24 ;;
            *) echo "ABI khong duoc ho tro: $BUILD_ABI"; exit 1 ;;
          esac
          nix develop -c bash -c '
            set -e
            cd zig-src
            zig build -Doptimize=ReleaseSmall -Dtarget='"$ZIG_TARGET"' jni
          '

      # Release build (R8 minify + resource shrink — roughly the official
      # nightly's size) signed with the committed fixed debug keystore via
      # the build.gradle.kts fallback, so it installs over the debug builds.
      #
      # -x lintVitalRelease: lint chiếm ~50s và không bắt được gì mà CI này cần —
      # đây là bản sideload cho một người dùng, không phải bản lên store.
      # Unit test (JVM) trước khi đốt 5 phút build: lỗi logic bị chặn tại đây.
      # QueueLiveContractTest tự skip khi không set QSRV_LIVE_URL.
      - name: unit tests
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            chmod +x ./gradlew
            ./gradlew testReleaseUnitTest
          '

      - name: build android release APK
        env:
          ANDROID_ABI_FILTERS: ${{ inputs.abi || 'arm64-v8a' }}
          # 23/8: từng quên truyền VERSION_* nên mọi APK sau v1.47 đều mang
          # versionCode 12.313.000 ("1.23.13") — cài lên máy đang có bản dòng
          # 1.47 (14.700.000) bị Android từ chối vì downgrade. Từ đây minor
          # phải tăng theo tên file phát hành.
          VERSION_MAJOR: '1'
          VERSION_MINOR: ${{ inputs.minor || '50' }}
          VERSION_PATCH: ${{ inputs.patch || '0' }}
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            chmod +x ./gradlew
            ./gradlew assembleRelease -x lintVitalRelease
          '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuchu-debug-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
