# One-off builder for a sideloadable arm64 debug APK (no signing secrets
# needed on a fork). Mirrors the nightly workflow's build steps.
name: Build debug APK

on:
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: build chuchu_jni
        run: |
          nix develop -c bash -c '
            set -e
            cd zig-src
            zig build -Doptimize=ReleaseSmall -Dtarget=aarch64-linux-android.24 jni
          '

      - name: build android debug APK
        env:
          ANDROID_ABI_FILTERS: arm64-v8a
        run: |
          nix develop -c bash -c '
            set -e
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug
          '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuchu-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
